services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicflow}
      POSTGRES_DB: clinicflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://clinicflow:${POSTGRES_PASSWORD:-clinicflow}@postgres:5432/clinicflow
      JWT_SECRET: ${JWT_SECRET:-clinicflow-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
